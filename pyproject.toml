[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-ai-grader"
version = "0.1.0"
description = "画法几何及机械制图 AI 智能作业批改验证 Demo"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2", "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13", "numpy>=1.26,<3", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-dotenv>=1,<2", "pandas>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "jsonschema>=4.23,<5", "ruff>=0.8,<1"]
browser = ["playwright>=1.45,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
